name: CI

on:
  push:
    branches: [master, develop]
    paths:
      - "Backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master, develop]
    paths:
      - "Backend/**"

defaults:
  run:
    working-directory: Backend

jobs:
  ci:
    name: Test & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: somos-barrio
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/somos-barrio?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_secret_for_testing_that_is_long_enough
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_DAYS: 30
      # Sin credenciales externas: proveedores apagados o apuntando a un puerto cerrado.
      # Los tests además bloquean cualquier HTTP fuera de localhost (src/test/no-external-network.ts).
      AI_PROVIDER_URL: http://127.0.0.1:9/v1
      AI_API_KEY: ci-sin-proveedor
      SIGHTENGINE_ENABLED: "false"
      CLOUDINARY_CLOUD_NAME: ci-sin-cloudinary
      CLOUDINARY_API_KEY: ci-sin-cloudinary
      CLOUDINARY_API_SECRET: ci-sin-cloudinary

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npm run typecheck

      - name: Build production artifact
        run: npm run build


      - name: Apply migrations (main DB)
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm test

      - name: Create test database
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -c 'CREATE DATABASE "somos-barrio-test";'

      - name: Apply migrations (test DB)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/somos-barrio-test?schema=public

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/somos-barrio-test?schema=public

  mobile-checks:
    name: Mobile App Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit
